name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: sushi-game-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sushi-game-backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formattazione
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Vulnerabilità dipendenze (runtime, high+)
        run: npm audit --omit=dev --audit-level=high

  app:
    name: App (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sushi-game-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sushi-game-app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Formattazione
        run: npm run format:check
      - name: Test
        run: npm run test:ci
      - name: Expo doctor
        run: npx expo-doctor
      - name: Build bundle Android (production)
        run: npm run export:android
        env:
          APP_VARIANT: production
      - name: Build bundle iOS (production)
        run: npm run export:ios
        env:
          APP_VARIANT: production
      # Le vulnerabilità "high" residue riguardano solo tool di build (Metro/PostCSS) e richiedono
      # l'aggiornamento dell'SDK Expo: vedi SECURITY.md. Il controllo blocca le critiche.
      - name: Vulnerabilità dipendenze (critical)
        run: npm audit --omit=dev --audit-level=critical
      - name: Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-coverage
          path: sushi-game-app/coverage/
          retention-days: 14
          if-no-files-found: ignore

  secrets:
    name: Scansione secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --redact --no-banner --verbose
