name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: sushi-game-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sushi-game-backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formattazione
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Vulnerabilità dipendenze (runtime, high+)
        run: npm audit --omit=dev --audit-level=high

  app:
    name: App (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sushi-game-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sushi-game-app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Formattazione
        run: npm run format:check
      - name: Test
        run: npm run test:ci
      - name: Expo doctor
        run: npx expo-doctor
      - name: Build bundle Android (production)
        run: npm run export:android
        env:
          APP_VARIANT: production
      - name: Build bundle iOS (production)
        run: npm run export:ios
        env:
          APP_VARIANT: production
      # Progetto nativo iOS generato su Linux (non serve un Mac): la build di produzione deve avere il
      # ciclo di vita a scene (richiesto dall'SDK di iOS 27) e gli Universal Links
      - name: Progetto nativo iOS (prebuild)
        run: |
          npx expo prebuild --platform ios --no-install
          PLIST=$(ls ios/*/Info.plist | head -1)
          grep -q UIApplicationSceneManifest "$PLIST" || { echo "::error::Manca UIApplicationSceneManifest in $PLIST"; exit 1; }
          grep -q "applinks:sushi.dietalab.net" ios/*/*.entitlements || { echo "::error::Mancano gli Universal Links"; exit 1; }
          grep -ho "IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*" ios/*.xcodeproj/project.pbxproj | sort -u
        env:
          APP_VARIANT: production
      # Con Expo SDK 57 non ci sono vulnerabilità note (vedi SECURITY.md)
      - name: Vulnerabilità dipendenze (high)
        run: npm audit --omit=dev --audit-level=high
      - name: Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-coverage
          path: sushi-game-app/coverage/
          retention-days: 14
          if-no-files-found: ignore

  secrets:
    name: Scansione secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --redact --no-banner --verbose
