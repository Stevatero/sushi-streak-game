name: Release

# Si avvia in tre modi:
#   - push di un tag vX.Y.Z (a mano);
#   - dal workflow "Release automatica", quando la CI su main è verde e la versione è nuova;
#   - a mano da Actions → Release → Run workflow, indicando un tag esistente.
# 1. Verifica che il tag corrisponda alla versione in sushi-game-app/package.json e al CHANGELOG
# 2. Crea la GitHub Release con le note della sezione corrispondente del CHANGELOG
# 3. Se il secret EXPO_TOKEN è configurato, avvia la build Android di produzione (AAB) su EAS
#    e, con "submit", attende la build e la invia al Google Play (traccia interna)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag esistente da rilasciare (es. v1.2.0)'
        required: true
      submit:
        description: 'Invia la build al Google Play (traccia interna)'
        type: boolean
        default: false
      build_id:
        description: 'Facoltativo: ID di una build EAS già completata da inviare al Google Play, senza ricompilare'
        type: string
        default: ''
  workflow_call:
    inputs:
      tag:
        description: 'Tag esistente da rilasciare'
        type: string
        required: true
      submit:
        description: 'Invia la build al Google Play (traccia interna)'
        type: boolean
        default: false
      build_id:
        description: 'Facoltativo: ID di una build EAS già completata da inviare, senza ricompilare'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Versione fissa di eas-cli: gira con EXPO_TOKEN e la chiave del Google Play, quindi niente "latest".
  # Dependabot non la aggiorna: alzarla a mano (npm view eas-cli version) dopo averne letto le note.
  EAS_CLI_VERSION: 24.8.0

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Verifica versione
        run: |
          VERSION="${TAG#v}"
          APP_VERSION=$(node -p "require('./sushi-game-app/package.json').version")
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "::error::Il tag $TAG non corrisponde alla versione dell'app ($APP_VERSION)"
            exit 1
          fi
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::Manca la sezione [$VERSION] nel CHANGELOG"; exit 1; }
      - name: Estrai note di rilascio
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          echo "" >> release-notes.md
          echo "_Stato Google Play: non ancora pubblicata in produzione (vedi docs/RELEASING.md)._" >> release-notes.md
      - name: Crea o aggiorna la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Le release restano "pre-release" finché la versione non è pubblicata in produzione sul Play Store
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "Sushi Streak $TAG" --notes-file release-notes.md --prerelease --verify-tag
          fi

  android-build:
    name: Build Android (EAS)
    needs: github-release
    runs-on: ubuntu-latest
    # Con l'invio si attende la build su EAS (anche la coda del piano gratuito)
    timeout-minutes: 240
    environment: production
    defaults:
      run:
        working-directory: sushi-game-app
    steps:
      - name: Verifica credenziali
        id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SUBMIT: ${{ inputs.submit == true || inputs.build_id != '' }}
          BUILD_ID_INPUT: ${{ inputs.build_id }}
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN non configurato: build Android saltata (vedi docs/RELEASING.md)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          # Senza la chiave del service account l'invio non può funzionare: meglio fermarsi subito,
          # prima di consumare una build EAS
          if [ "$SUBMIT" = "true" ] && [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::error::Manca il secret GOOGLE_SERVICE_ACCOUNT_KEY (ambiente production) per l'invio al Google Play: vedi docs/RELEASING.md"
            exit 1
          fi
          # Il secret deve contenere il file JSON della chiave del service account (non una chiave API
          # "AIza…"): si controlla la struttura senza mai stamparne il contenuto
          if [ "$SUBMIT" = "true" ] && ! node -e '
            const k = JSON.parse(process.env.GOOGLE_SERVICE_ACCOUNT_KEY);
            if (k.type !== "service_account" || !k.client_email || !k.private_key) process.exit(1);
          ' >/dev/null 2>&1; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_KEY non è il JSON di una chiave di service account (servono type \"service_account\", client_email e private_key): vedi docs/RELEASING.md"
            exit 1
          fi
          if [ -n "$BUILD_ID_INPUT" ] && ! [[ "$BUILD_ID_INPUT" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::build_id non valido: serve l'ID (UUID) di una build EAS"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.enabled == 'true'
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sushi-game-app/package-lock.json
      - if: steps.check.outputs.enabled == 'true'
        run: npm ci
      - name: Build AAB di produzione (senza invio)
        if: steps.check.outputs.enabled == 'true' && inputs.submit != true && inputs.build_id == ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes "eas-cli@$EAS_CLI_VERSION" build --platform android --profile production --non-interactive --no-wait
      # Con l'invio si attende la fine della build e si invia proprio quella (non "l'ultima"): il
      # versionCode viene incrementato da EAS (appVersionSource remote + autoIncrement)
      - name: Build AAB di produzione
        id: build
        if: steps.check.outputs.enabled == 'true' && inputs.submit == true && inputs.build_id == ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Il risultato va fuori dal repository: con requireCommit EAS rifiuta file non committati
          OUT="$RUNNER_TEMP/eas-build.json"
          npx --yes "eas-cli@$EAS_CLI_VERSION" build --platform android --profile production --non-interactive --wait --json > "$OUT"
          BUILD_ID=$(node -p "require(process.argv[1])[0].id" "$OUT")
          node -p "const b = require(process.argv[1])[0]; 'Build ' + b.id + ': ' + b.status + ', versionCode ' + b.appBuildVersion" "$OUT"
          echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"
      - name: Invio a Google Play (traccia interna)
        if: steps.check.outputs.enabled == 'true' && (inputs.submit == true || inputs.build_id != '')
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          # Build appena completata, oppure quella indicata a mano (build_id)
          BUILD_ID: ${{ inputs.build_id || steps.build.outputs.id }}
        run: |
          # Chiave del service account solo per la durata del job (il file è escluso da git)
          umask 077
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > google-service-account.json
          npx --yes "eas-cli@$EAS_CLI_VERSION" submit --platform android --profile production --id "$BUILD_ID" --non-interactive
      - name: Rimuovi la chiave del service account
        if: always() && steps.check.outputs.enabled == 'true'
        run: rm -f google-service-account.json
