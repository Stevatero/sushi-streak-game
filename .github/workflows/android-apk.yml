name: APK Android

# Compila un APK installabile direttamente, senza EAS, sui runner GitHub (che includono Android SDK
# e NDK) e lo pubblica come asset di due pre-release:
#   - apk-<variante>-v<versione>[-arm64]: una per versione dell'app;
#   - apk-<variante>-latest[-arm64]: sempre l'ultima build, con un nome file fisso, per avere un
#     link di download che non cambia.
# Se la versione è già stata compilata da un commit diverso la build si ferma: prima di compilare
# nuove modifiche va aggiornata la versione (vedi docs/RELEASING.md).
#
# L'APK è firmato con la chiave di debug del template Expo: va bene per i test, ma non aggiorna una
# versione installata dal Play Store (la variante "preview" ha un application ID diverso e si
# installa accanto).
#
# Con l'architettura x86_64 (emulatore Android su PC) l'APK è solo un artifact della run: nessuna
# pre-release e nessun controllo della versione, i link fissi restano quelli dei telefoni.
#
# Avvio: Actions → "APK Android" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variante da compilare'
        type: choice
        options: [preview, production]
        default: preview
      abi:
        description: 'Architetture (solo arm64: APK più leggero, per i telefoni degli ultimi anni; x86_64: emulatore, solo artifact)'
        type: choice
        options: ['arm64-v8a,armeabi-v7a', 'arm64-v8a', 'x86_64']
        default: 'arm64-v8a,armeabi-v7a'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}-${{ inputs.variant }}-${{ inputs.abi }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK (${{ inputs.variant }}, ${{ inputs.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_VARIANT: ${{ inputs.variant }}
      ABI: ${{ inputs.abi }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: sushi-game-app
    steps:
      - uses: actions/checkout@v7
      - name: Versione e nomi dei file
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$ABI" in
            arm64-v8a) SUFFIX="-arm64" ;;
            x86_64) SUFFIX="-x86_64" ;;
            *) SUFFIX="" ;;
          esac
          TAG="apk-${APP_VARIANT}-v${VERSION}${SUFFIX}"
          # Una versione già compilata da un altro commit va aggiornata prima di una nuova build
          BUILT_FROM=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ "$ABI" != "x86_64" ] && [ -n "$BUILT_FROM" ] && [ "$BUILT_FROM" != "$GITHUB_SHA" ]; then
            echo "::error::La versione $VERSION è già stata compilata dal commit ${BUILT_FROM::7}. Aggiorna la versione (npm version patch|minor --no-git-tag-version) e il CHANGELOG prima di una nuova build."
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "version_code=$(node scripts/version-code.js)"
            echo "tag=$TAG"
            echo "name=sushi-streak-${VERSION}-${APP_VARIANT}${SUFFIX}.apk"
            echo "latest_tag=apk-${APP_VARIANT}-latest${SUFFIX}"
            echo "latest_name=sushi-streak-${APP_VARIANT}${SUFFIX}.apk"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sushi-game-app/package-lock.json
      - run: npm ci
      - name: Esclude gli strumenti di sviluppo dalla build
        run: node scripts/configure-build-variant.js
      - name: Genera il progetto Android
        env:
          ANDROID_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: npx expo prebuild --platform android --no-install
      - name: Compila l'APK di rilascio
        working-directory: sushi-game-app/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures="$ABI" \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"
      - name: Prepara i file
        env:
          NAME: ${{ steps.meta.outputs.name }}
          LATEST_NAME: ${{ steps.meta.outputs.latest_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          cp "$NAME" "$LATEST_NAME"
          ls -lh "$NAME"
          {
            echo "APK di test **${APP_VARIANT}** di Sushi Streak **${VERSION}** (versionCode ${VERSION_CODE}), compilato dal commit ${GITHUB_SHA}. Architetture: ${ABI//,/, }."
            echo
            echo "### Come installarlo"
            echo
            echo "1. Apri il link dell'APK dal telefono con **Chrome** (non dal browser interno di altre app)."
            echo "2. Se Chrome avvisa che il file può essere dannoso, tocca **Scarica comunque**: il download termina solo dopo la conferma."
            echo "3. Apri il file dalla notifica di download o da **File → Download**."
            echo "4. Se richiesto, consenti a Chrome (o all'app File) di **installare app sconosciute**; se Play Protect avvisa, scegli **Installa comunque**."
            echo
            echo "La variante preview si installa accanto alla versione del Play Store (\"Sushi Streak (Preview)\"). Firmato con la chiave di debug: non aggiorna versioni installate da EAS o dal Play Store."
            echo
            echo "Changelog: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/CHANGELOG.md"
          } > notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.name }}
          path: sushi-game-app/${{ steps.meta.outputs.name }}
          retention-days: 30
      - name: Pubblica le pre-release
        if: inputs.abi != 'x86_64'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
          LATEST_NAME: ${{ steps.meta.outputs.latest_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          publish() {
            gh release delete "$1" --cleanup-tag --yes >/dev/null 2>&1 || true
            # Il tag appena cancellato può non essere ancora libero: senza pausa GitHub può lasciare
            # la nuova release in bozza, con il link di download non raggiungibile
            sleep 5
            gh release create "$1" "$2" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "$3" --notes-file notes.md
            for attempt in 1 2 3; do
              [ "$(gh release view "$1" --json isDraft --jq .isDraft)" = "false" ] && return 0
              echo "La release $1 è ancora in bozza: pubblicazione (tentativo $attempt)"
              sleep 5
              gh release edit "$1" --draft=false --prerelease --latest=false >/dev/null || true
            done
            echo "::error::La release $1 è rimasta in bozza"
            return 1
          }
          publish "$TAG" "$NAME" "APK ${APP_VARIANT} ${VERSION} (${ABI//,/ + })"
          publish "$LATEST_TAG" "$LATEST_NAME" "APK ${APP_VARIANT} più recente (${ABI//,/ + })"
          echo "Link fisso: https://github.com/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/${LATEST_NAME}"
