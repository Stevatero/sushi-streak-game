name: 🐛 Segnalazione bug
description: Qualcosa non funziona come dovrebbe
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Grazie per la segnalazione! Per le vulnerabilità di sicurezza **non** aprire una issue pubblica: segui [SECURITY.md](https://github.com/Stevatero/sushi-streak-game/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Descrizione
      description: Cosa è successo e cosa ti aspettavi.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passi per riprodurre
      placeholder: |
        1. Crea una sessione
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versione dell'app
      description: Impostazioni → Info
      placeholder: '1.3.0'
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Dispositivo e versione Android
      placeholder: 'Pixel 8, Android 16'
  - type: textarea
    id: extra
    attributes:
      label: Informazioni aggiuntive
      description: Screenshot o altri dettagli utili. Non includere dati personali.
